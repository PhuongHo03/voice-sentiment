events {}
http {
  # Docker's internal DNS server is always at 127.0.0.11.
  # We set a low TTL (5s) to force Nginx to refresh container IPs dynamically.
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;
    client_max_body_size 100M;

    location /api/ {
      set $backend_url http://backend:8000;
      proxy_pass $backend_url;
    }

    location /health {
      set $backend_url http://backend:8000;
      proxy_pass $backend_url;
    }

    location /observability/api/ {
      proxy_pass http://prometheus:9090/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }

    location /nginx_status {
      stub_status;
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
    }

    location / {
      set $frontend_url http://frontend:5173;
      proxy_pass $frontend_url;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
