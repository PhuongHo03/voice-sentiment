services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voice_sentiment
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
      - redis
      - rabbitmq

  worker:
    build: ./worker
    env_file: ./worker/.env
    depends_on:
      - postgres
      - minio
      - redis
      - rabbitmq

  frontend:
    build: ./frontend
    env_file: ./frontend/.env

    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  adminer:
    image: adminer:latest
    ports:
      - "8083:8080"
    depends_on:
      - postgres

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "8084:8001"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

volumes:
  postgres_data:
  minio_data:
  redisinsight_data:

