services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_sentiment}
      POSTGRES_USER: ${POSTGRES_USER:-voice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "9000"
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9092}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-9094}:15672"
    expose:
      - "5672"
      - "15692"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://${REDIS_HOST:-redis}:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F"
      PROMETHEUS_URL: "http://prometheus:9090"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "false"
    restart: always
    # Host port hidden for production-grade security (Only exposed internally to Nginx on port 8000)
    depends_on:
      - postgres
      - minio
      - redis
      - rabbitmq

  frontend:
    build: ./frontend
    env_file: .env
    restart: always
    # Host port hidden for production-grade security (Only exposed internally to Nginx on port 5173)
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${NGINX_PORT:-9090}:80"
    volumes:
      - ./infras/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  adminer:
    image: adminer:latest
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${ADMINER_PORT:-9091}:8080"
    depends_on:
      - postgres

  redisinsight:
    image: redis/redisinsight:latest
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${REDISINSIGHT_PORT:-9093}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./infras/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - voice-worker
      - llm-worker
      - postgres-exporter
      - redis-exporter
      - rabbitmq
      - minio

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:-voice}@postgres:5432/${POSTGRES_DB:-voice_sentiment}?sslmode=disable
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      - redis

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: always
    command:
      - --nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      - nginx

  voice-worker:
    build: ./voice-worker
    env_file: .env
    restart: always
    expose:
      - "8000"

  llm-worker:
    build: ./llm-worker
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://${REDIS_HOST:-redis}:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2F"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "false"
    restart: always
    expose:
      - "9100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      ollama serve &
      PID=$$!;
      sleep 5;
      echo 'Checking and pulling ${LLM_MODEL:-qwen2.5:1.5b} model...';
      ollama pull ${LLM_MODEL:-qwen2.5:1.5b};
      wait $$PID;
      "

volumes:
  postgres_data:
  minio_data:
  redisinsight_data:
  prometheus_data:
  ollama_data:
