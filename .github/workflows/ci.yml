name: Voice Sentiment CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+psycopg://voice:voice@localhost/voice_sentiment"
      REDIS_URL: "redis://localhost:6379"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672"
      MINIO_ENDPOINT: "localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Tests
        run: |
          cd backend
          pytest

  voice-worker-tests:
    name: Voice Worker Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'voice-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r voice-worker/requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          cd voice-worker
          pytest

  llm-worker-tests:
    name: LLM Worker Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+psycopg://voice:voice@localhost/voice_sentiment"
      REDIS_URL: "redis://localhost:6379"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672"
      MINIO_ENDPOINT: "localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      VOICE_SERVER_URI: "http://localhost:9095"
      LLM_BASE_URL: "http://localhost:8007/v1"
      LLM_API_KEY: "sk-dummykey"
      LLM_MODEL: "dummy-model"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'llm-worker/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r llm-worker/requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          cd llm-worker
          pytest

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Compile and Build
        run: |
          cd frontend
          npm run build
